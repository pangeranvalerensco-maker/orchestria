spring.application.name=api-gateway
server.port=8000

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=organization-service
spring.cloud.gateway.server.webflux.routes[1].uri=${ORGANIZATION_SERVICE_URL:http://localhost:8002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/organization/**

spring.cloud.gateway.server.webflux.routes[2].id=request-service
spring.cloud.gateway.server.webflux.routes[2].uri=${REQUEST_SERVICE_URL:http://localhost:8003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/requests/**

spring.cloud.gateway.server.webflux.routes[3].id=finance-service
spring.cloud.gateway.server.webflux.routes[3].uri=${FINANCE_SERVICE_URL:http://localhost:8004}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/finance/**