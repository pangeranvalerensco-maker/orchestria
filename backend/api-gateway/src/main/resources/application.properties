spring.application.name=api-gateway
server.port=8000

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=organization-service
spring.cloud.gateway.server.webflux.routes[1].uri=${ORGANIZATION_SERVICE_URL:http://localhost:8002}
