# Notification Report Service - Konfigurasi Lokal
# Salin file ini ke application-local.properties dan isi dengan nilai yang sesuai

# ===========================
# SMTP (Email)
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# Pengirim default
app.mail.from=YOUR_EMAIL@gmail.com
app.mail.from-name=Orchestria System

# ===========================
# Request Service
# ===========================
services.request.base-url=http://localhost:8003

# ===========================
# Scheduler
# ===========================
# Set false untuk menonaktifkan semua scheduler
app.scheduler.enabled=true

# ===========================
# Logging
# ===========================
logging.level.com.pangeranvalerensco.orchestria=INFO
