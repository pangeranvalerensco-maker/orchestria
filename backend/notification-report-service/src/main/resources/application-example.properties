# Notification Report Service - konfigurasi lokal
# Salin menjadi application-local.properties dan isi sesuai environment.

# JWT verification; gunakan nilai yang sama dengan auth-service.
app.jwt.secret=${JWT_SECRET}

# SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

app.mail.from=${MAIL_FROM}
app.mail.from-name=Orchestria System

# Request Service
services.request.base-url=http://localhost:8003

# Scheduler
app.scheduler.enabled=true
app.scheduler.cron.weekly-report=0 0 8 * * MON

# Logging
logging.level.com.pangeranvalerensco.orchestria=INFO
