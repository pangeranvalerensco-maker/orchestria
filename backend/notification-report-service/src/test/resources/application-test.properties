# Test configuration isolated from external infrastructure
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@orchestria.local
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=test@orchestria.local
app.mail.from-name=Orchestria Test

services.request.base-url=http://127.0.0.1:1

spring.datasource.url=jdbc:h2:mem:notification_report_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.scheduler.enabled=false
app.scheduler.cron.weekly-report=0 0 0 31 2 ?

app.jwt.secret=orchestria-test-jwt-secret-key-minimum-32-characters-long
app.internal.api-key=test-internal-api-key

logging.level.com.pangeranvalerensco.orchestria=INFO
logging.level.org.springframework.mail=WARN

app.internal.api-key=test-internal-api-key
