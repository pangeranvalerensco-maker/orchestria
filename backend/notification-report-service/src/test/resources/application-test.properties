# ===========================
# Test Configuration - Isolated
# ===========================
# Profile test tidak memerlukan koneksi SMTP nyata
# JavaMailSender dikonfigurasi dengan mock/stub

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@orchestria.local
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Pengirim default untuk test
app.mail.from=test@orchestria.local
app.mail.from-name=Orchestria Test

# ===========================
# Request Service (mock URL untuk test)
# ===========================
services.request.base-url=http://localhost:8099

# ===========================
# Scheduler DINONAKTIFKAN saat test
# ===========================
app.scheduler.enabled=false

# Cron yang tidak akan pernah terpicu
app.scheduler.cron.weekly-report=0 0 0 31 2 ?

# ===========================
# Logging
# ===========================
logging.level.com.pangeranvalerensco.orchestria=INFO
logging.level.org.springframework.mail=WARN
