server.port=8001
spring.application.name=auth-service

spring.profiles.active=local

app.internal.api-key=${INTERNAL_API_KEY:orchestria-default-internal-api-key}
app.services.notification-report.url=http://localhost:8005

# TrustedDevice Config
app.auth.trusted-device.cookie-secure=false
app.auth.trusted-device.days=7

app.session-demo.enabled=${SESSION_DEMO_ENABLED:true}
app.session-demo.timeout-seconds=${SESSION_DEMO_TIMEOUT_SECONDS:900}
app.session-demo.cookie-secure=${SESSION_DEMO_COOKIE_SECURE:false}

server.servlet.session.cookie.name=ORCHESTRIA_SESSION_DEMO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api/auth/session-demo
server.servlet.session.cookie.secure=${SESSION_DEMO_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_DEMO_TIMEOUT:15m}
