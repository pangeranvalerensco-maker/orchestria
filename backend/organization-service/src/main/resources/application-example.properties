server.port=8002
spring.application.name=organization-service

spring.datasource.url=jdbc:postgresql://localhost:5432/orchestria_organization_db
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=YOUR_MINIMUM_32_CHARACTERS_JWT_SECRET

app.bootstrap-member.enabled=false
app.bootstrap-member.auth-user-id=YOUR_AUTH_USER_ID
app.bootstrap-member.full-name=YOUR_MEMBER_FULL_NAME
app.bootstrap-member.email=YOUR_MEMBER_EMAIL
app.bootstrap-member.division-code=DIVDIK
app.bootstrap-member.position-code=KETUA_DIVISI
