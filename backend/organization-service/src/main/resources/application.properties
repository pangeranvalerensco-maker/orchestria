server.port=8002
spring.application.name=organization-service

spring.profiles.active=local

# Archive storage (configurable via env ARCHIVE_STORAGE_PATH)
archive.storage.path=${ARCHIVE_STORAGE_PATH:./storage/archive}
archive.storage.max-size-bytes=${ARCHIVE_MAX_SIZE_BYTES:10485760}

# Multipart for archive upload (allow slightly above 10MB to handle encoding overhead)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
