spring.datasource.url=jdbc:h2:mem:organization_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.mode=never

app.jwt.secret=orchestria-test-jwt-secret-key-12345678901234567890

# Archive storage — arahkan ke target/test-storage agar tidak menulis ke storage project nyata.
# Nilai ini dioverride per-test oleh @DynamicPropertySource menggunakan @TempDir.
archive.storage.path=./target/test-storage/archive
archive.storage.max-size-bytes=10485760

app.internal.api-key=test-internal-api-key
